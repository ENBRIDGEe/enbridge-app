name: enbridge
description: "Enbridge — Your productivity bridge to maximum potential."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  confetti: ^0.7.0
  flutter_svg: ^2.0.10+1
  go_router: ^14.3.0
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.4
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
